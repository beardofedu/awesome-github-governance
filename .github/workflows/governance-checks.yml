name: GitHub platform governance

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test calendar, coverage, freshness, and baseline contracts
        run: python3 -m unittest discover -s test-suite/checks -p 'test_*.py'
      - name: Compare live repository configuration to the approved baseline
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 test-suite/checks/check_repository.py "$GITHUB_REPOSITORY"

  report-status:
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (needs.verify.result == 'success' || needs.verify.result == 'failure')
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: governance-check-issue-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      issues: write
    steps:
      - name: Update the governance check issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        with:
          script: |
            const title = "[governance] Checks failed";
            const marker = "<!-- governance-check-failure -->";
            const open = await github.paginate(github.rest.issues.listForRepo,
              { ...context.repo, state: "open", per_page: 100 });
            const existing = open.find(item =>
              !item.pull_request && item.user?.login === "github-actions[bot]" &&
              item.title === title && item.body?.startsWith(marker));
            if (process.env.VERIFY_RESULT === "success") {
              if (existing) await github.rest.issues.update({
                ...context.repo, issue_number: existing.number, state: "closed",
                state_reason: "completed",
              });
              return;
            }
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\nThe scheduled or manual repository baseline check failed. [Inspect the run](${run}) before changing the baseline.`;
            if (existing) await github.rest.issues.update({
              ...context.repo, issue_number: existing.number, body,
            });
            else await github.rest.issues.create({ ...context.repo, title, body });
